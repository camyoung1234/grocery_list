<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Grocery List — Store &amp; Voice Inventory</title>
    <meta name="description" content="Organize groceries by store aisle, count home inventory with your voice, and generate a smart shopping list.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400..700&family=Google+Sans+Flex:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- PWA & Mobile Install Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#15803d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Groceries">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body>
    <div class="app-shell">
        <!-- STORE MODE (All Items & Shopping List) -->
        <main id="store-view" class="main-content" aria-label="Store View">
            <div class="top-actions-row">
                <span id="store-view-heading" class="view-heading">All Items</span>
                <div class="top-actions-right">
                    <button type="button" id="add-aisle-open-btn" class="btn-tonal-sm">
                        + Aisle
                    </button>
                    <button type="button" id="clear-checks-btn" class="btn-tonal-sm hidden">
                        Clear Checks
                    </button>
                </div>
            </div>

            <!-- Inline Add Aisle Form (toggled) -->
            <form id="add-aisle-form" class="add-aisle-card hidden">
                <input type="text" id="new-aisle-input" class="text-input" placeholder="New aisle name (e.g. Frozen, Bakery)..." aria-label="New aisle name" autocomplete="off">
                <div class="add-aisle-actions">
                    <button type="button" id="add-aisle-cancel-btn" class="btn-ghost">Cancel</button>
                    <button type="submit" class="btn-primary">Add Aisle</button>
                </div>
            </form>

            <div id="store-aisles-container" class="aisles-container">
                <!-- Rendered dynamically -->
            </div>
        </main>

        <!-- INVENTORY MODE -->
        <main id="inventory-view" class="main-content hidden" aria-label="Inventory Mode">
            <section class="voice-card" aria-label="Voice and Quick Inventory Entry">
                <div class="voice-card-header">
                    <div>
                        <h2 class="voice-card-title">Take Inventory</h2>
                        <p class="voice-card-subtitle">Say or type <code>&lt;item&gt; &lt;count&gt;</code> — e.g. <em>&ldquo;wipes 3&rdquo;</em> or <em>&ldquo;milk 2&rdquo;</em></p>
                    </div>
                    <button type="button" id="voice-mic-btn" class="mic-btn" aria-label="Start voice input" aria-pressed="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                        <span id="voice-mic-label">Speak</span>
                    </button>
                </div>

                <form id="inventory-command-form" class="command-form">
                    <input type="text" id="inventory-command-input" class="command-input" placeholder='Type or speak: "wipes 3", "bananas 4"...' aria-label="Inventory item and count" autocomplete="off">
                    <button type="submit" id="inventory-command-submit" class="btn-primary">Add</button>
                </form>

                <div id="voice-feedback" class="voice-feedback" role="status" aria-live="polite">
                    Ready — tap Speak or type an item &amp; count.
                </div>
            </section>

            <section class="inventory-list-section" aria-label="Inventory Entries">
                <div class="inventory-list-header">
                    <div class="inventory-summary" id="inventory-summary">0 entries</div>
                    <button type="button" id="clear-inventory-btn" class="btn-ghost-danger hidden">Clear All</button>
                </div>

                <ul id="inventory-entries-list" class="inventory-entries-list">
                    <!-- Rendered dynamically -->
                </ul>
            </section>
        </main>
    </div>

    <!-- Bottom Thumb-Reachable Bar -->
    <footer class="bottom-bar-wrap">
        <div id="bottom-nav-bar" class="bottom-bar">
            <button type="button" id="search-open-btn" class="bottom-icon-btn" aria-label="Search items or aisles" title="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>

            <nav class="segmented-nav" aria-label="Primary Views">
                <button type="button" id="tab-all-btn" class="segmented-tab active" data-tab="all" aria-pressed="true">
                    <span>All Items</span>
                </button>
                <button type="button" id="tab-shopping-btn" class="segmented-tab" data-tab="shopping" aria-pressed="false">
                    <span>Shopping</span>
                    <span id="shopping-count-badge" class="nav-badge">0</span>
                </button>
                <button type="button" id="tab-inventory-btn" class="segmented-tab" data-tab="inventory" aria-pressed="false">
                    <span>Inventory</span>
                    <span id="inventory-pending-badge" class="nav-badge warn hidden">0</span>
                </button>
            </nav>

            <button type="button" id="settings-open-btn" class="bottom-icon-btn" aria-label="Open settings" title="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>

        <div id="bottom-search-bar" class="bottom-bar bottom-search-bar hidden">
            <div class="bottom-search-field">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="search" id="store-search-input" class="bottom-search-input" placeholder="Search items or aisles..." aria-label="Search items or aisles" autocomplete="off">
            </div>
            <button type="button" id="search-close-btn" class="bottom-icon-btn" aria-label="Close search" title="Close search">
                ×
            </button>
        </div>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
        <div class="modal-sheet">
            <div class="modal-header">
                <h2 id="settings-modal-title" class="modal-title">Display &amp; Settings</h2>
                <button type="button" id="settings-close-btn" class="icon-btn" aria-label="Close settings">×</button>
            </div>

            <div class="settings-list">
                <label class="setting-row" for="setting-show-all-stock">
                    <div class="setting-text">
                        <div class="setting-label">Show stock status on All Items</div>
                        <div class="setting-desc">Display Stocked, Have, and Need badges under each item</div>
                    </div>
                    <input type="checkbox" id="setting-show-all-stock" class="toggle-switch">
                </label>

                <label class="setting-row" for="setting-show-shopping-hw">
                    <div class="setting-text">
                        <div class="setting-label">Show Have &amp; Want on Shopping List</div>
                        <div class="setting-desc">Display current and target counts under each item to buy</div>
                    </div>
                    <input type="checkbox" id="setting-show-shopping-hw" class="toggle-switch">
                </label>

                <label class="setting-row" for="setting-show-aisle-counts">
                    <div class="setting-text">
                        <div class="setting-label">Show item counts on aisles</div>
                        <div class="setting-desc">Display the number badge next to each aisle name</div>
                    </div>
                    <input type="checkbox" id="setting-show-aisle-counts" class="toggle-switch">
                </label>

                <label class="setting-row" for="setting-compact-density">
                    <div class="setting-text">
                        <div class="setting-label">Compact list density</div>
                        <div class="setting-desc">Tighter row spacing to fit more items on screen</div>
                    </div>
                    <input type="checkbox" id="setting-compact-density" class="toggle-switch">
                </label>

                <div class="setting-row static">
                    <div class="setting-text">
                        <div class="setting-label">Storage &amp; Sync</div>
                        <div class="setting-desc">Saved locally in your browser</div>
                    </div>
                    <span class="status-chip">
                        <span class="auth-dot" aria-hidden="true"></span>
                        <span id="auth-status-label">Local Mode</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
