<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Grocery List — Store &amp; Voice Inventory</title>
    <meta name="description" content="Organize groceries by store aisle, count home inventory with your voice, and generate a smart shopping list.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400..700&family=Google+Sans+Flex:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- PWA & Mobile Install Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#15803d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Groceries">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body>
    <div class="app-shell">
        <!-- STORE MODE (All Items & Shopping List) -->
        <main id="store-view" class="main-content" aria-label="Store View">
            <div class="top-actions-row">
                <span id="store-view-heading" class="view-heading">All Items</span>
                <div class="top-actions-right">
                    <button type="button" id="add-aisle-open-btn" class="btn-tonal-sm">
                        + Aisle
                    </button>
                    <button type="button" id="clear-checks-btn" class="btn-tonal-sm hidden">
                        Clear Checks
                    </button>
                </div>
            </div>

            <!-- Inline Add Aisle Form (toggled) -->
            <form id="add-aisle-form" class="add-aisle-card hidden">
                <input type="text" id="new-aisle-input" class="text-input" placeholder="New aisle name (e.g. Frozen, Bakery)..." aria-label="New aisle name" autocomplete="off">
                <div class="add-aisle-actions">
                    <button type="button" id="add-aisle-cancel-btn" class="btn-ghost">Cancel</button>
                    <button type="submit" class="btn-primary">Add Aisle</button>
                </div>
            </form>

            <div id="store-aisles-container" class="aisles-container">
                <!-- Rendered dynamically -->
            </div>
        </main>

        <!-- INVENTORY MODE -->
        <main id="inventory-view" class="main-content hidden" aria-label="Inventory Mode">
            <div class="top-actions-row">
                <div class="inventory-top-left">
                    <span class="view-heading">Inventory</span>
                    <span class="inventory-summary" id="inventory-summary">0 entries</span>
                </div>
                <div class="top-actions-right">
                    <button type="button" id="clear-inventory-btn" class="btn-ghost-danger hidden">Clear All</button>
                </div>
            </div>

            <div id="voice-feedback" class="sr-only" role="status" aria-live="polite"></div>

            <section class="inventory-list-section" aria-label="Inventory Entries">
                <ul id="inventory-entries-list" class="inventory-entries-list">
                    <!-- Rendered dynamically -->
                </ul>
            </section>
        </main>
    </div>

    <!-- Bottom Thumb-Reachable Bar -->
    <footer class="bottom-bar-wrap">
        <div id="bottom-nav-bar" class="bottom-bar">
            <button type="button" id="search-open-btn" class="bottom-icon-btn" aria-label="Search items or aisles" title="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>

            <nav class="segmented-nav" aria-label="Primary Views">
                <button type="button" id="tab-inventory-btn" class="segmented-tab" data-tab="inventory" aria-label="Inventory" title="Inventory" aria-pressed="false">
                    <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                </button>
                <button type="button" id="tab-shopping-btn" class="segmented-tab" data-tab="shopping" aria-label="Shopping" title="Shopping" aria-pressed="false">
                    <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m3 7 2 2 4-4"/>
                        <path d="m3 17 2 2 4-4"/>
                        <line x1="13" y1="6" x2="21" y2="6"/>
                        <line x1="13" y1="12" x2="21" y2="12"/>
                        <line x1="13" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <button type="button" id="tab-all-btn" class="segmented-tab active" data-tab="all" aria-label="All Items" title="All Items" aria-pressed="true">
                    <svg class="tab-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="9" y1="6" x2="21" y2="6"/>
                        <line x1="9" y1="12" x2="21" y2="12"/>
                        <line x1="9" y1="18" x2="21" y2="18"/>
                        <circle cx="4" cy="6" r="1.25" fill="currentColor" stroke="none"/>
                        <circle cx="4" cy="12" r="1.25" fill="currentColor" stroke="none"/>
                        <circle cx="4" cy="18" r="1.25" fill="currentColor" stroke="none"/>
                    </svg>
                </button>
            </nav>

            <button type="button" id="undo-btn" class="bottom-icon-btn" aria-label="Undo" title="Undo" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 7v6h6"/>
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
                </svg>
            </button>

            <button type="button" id="settings-open-btn" class="bottom-icon-btn" aria-label="Open settings" title="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>

        <div id="bottom-inventory-bar" class="bottom-bar bottom-inventory-bar hidden">
            <button type="button" id="voice-mic-btn" class="bottom-icon-btn mic-toggle-btn" aria-label="Toggle voice input" title="Toggle voice input" aria-pressed="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <form id="inventory-command-form" class="bottom-inventory-form">
                <input type="text" id="inventory-command-input" class="bottom-inventory-input" placeholder='Speak or type "wipes 3"...' aria-label="Inventory item and count" autocomplete="off" enterkeyhint="done">
            </form>
            <button type="button" id="inventory-close-btn" class="bottom-icon-btn" aria-label="Close inventory input" title="Close inventory input">
                ×
            </button>
        </div>

        <div id="bottom-search-bar" class="bottom-bar bottom-search-bar hidden">
            <div class="bottom-search-field">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="search" id="store-search-input" class="bottom-search-input" placeholder="Search items or aisles..." aria-label="Search items or aisles" autocomplete="off">
            </div>
            <button type="button" id="search-close-btn" class="bottom-icon-btn" aria-label="Close search" title="Close search">
                ×
            </button>
        </div>
    </footer>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
        <div class="modal-sheet">
            <div class="modal-header">
                <h2 id="settings-modal-title" class="modal-title">Display &amp; Settings</h2>
                <button type="button" id="settings-close-btn" class="icon-btn" aria-label="Close settings">×</button>
            </div>

            <div class="settings-list">
                <label class="setting-row" for="setting-show-all-stock">
                    <div class="setting-text">
                        <div class="setting-label">Show stock status on All Items</div>
                        <div class="setting-desc">Display Stocked, Have, and Need badges under each item</div>
                    </div>
                    <input type="checkbox" id="setting-show-all-stock" class="toggle-switch">
                </label>

                <label class="setting-row" for="setting-show-shopping-hw">
                    <div class="setting-text">
                        <div class="setting-label">Show Have &amp; Want on Shopping List</div>
                        <div class="setting-desc">Display current and target counts under each item to buy</div>
                    </div>
                    <input type="checkbox" id="setting-show-shopping-hw" class="toggle-switch">
                </label>

                <label class="setting-row" for="setting-show-aisle-counts">
                    <div class="setting-text">
                        <div class="setting-label">Show item counts on aisles</div>
                        <div class="setting-desc">Display the number badge next to each aisle name</div>
                    </div>
                    <input type="checkbox" id="setting-show-aisle-counts" class="toggle-switch">
                </label>

                <label class="setting-row" for="setting-compact-density">
                    <div class="setting-text">
                        <div class="setting-label">Compact list density</div>
                        <div class="setting-desc">Tighter row spacing to fit more items on screen</div>
                    </div>
                    <input type="checkbox" id="setting-compact-density" class="toggle-switch">
                </label>

                <label class="setting-row" for="setting-inventory-sort">
                    <div class="setting-text">
                        <div class="setting-label">Inventory list order</div>
                        <div class="setting-desc">Sort matched items after items needing disambiguation</div>
                    </div>
                    <select id="setting-inventory-sort" class="setting-select">
                        <option value="added">Order added</option>
                        <option value="alphabetical">Alphabetical</option>
                        <option value="aisle">By aisle</option>
                    </select>
                </label>

                <div class="setting-row static">
                    <div class="setting-text">
                        <div class="setting-label">Account &amp; Sync</div>
                        <div class="setting-desc" id="auth-account-desc">Not signed in — saved locally</div>
                    </div>
                    <div class="setting-auth-actions">
                        <span class="status-chip">
                            <span id="auth-status-dot" class="auth-dot offline" aria-hidden="true"></span>
                            <span id="auth-status-label">Offline</span>
                        </span>
                        <button type="button" id="settings-auth-btn" class="btn-tonal-sm">Sign In</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
        <div class="modal-sheet">
            <div class="modal-header">
                <h2 id="auth-modal-title" class="modal-title">Sign In to Sync</h2>
                <button type="button" id="auth-close-btn" class="icon-btn" aria-label="Continue offline">×</button>
            </div>
            <p class="auth-modal-desc">Sign in with your existing account to sync your aisles and inventory across devices.</p>
            <form id="auth-form" class="auth-form">
                <input type="email" id="auth-email-input" class="text-input" placeholder="Email" autocomplete="email" required>
                <input type="password" id="auth-password-input" class="text-input" placeholder="Password" autocomplete="current-password" required>
                <div id="auth-error-msg" class="auth-error hidden" role="alert"></div>
                <div class="auth-form-actions">
                    <button type="submit" id="auth-signin-btn" class="btn-primary">Sign In</button>
                    <button type="button" id="auth-signup-btn" class="btn-tonal-sm">Create Account</button>
                </div>
            </form>
            <button type="button" id="auth-offline-btn" class="btn-ghost auth-offline-btn">Continue Offline</button>
        </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
