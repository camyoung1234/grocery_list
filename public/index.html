<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Grocery List — Store &amp; Voice Inventory</title>
    <meta name="description" content="Organize groceries by store aisle, count home inventory with your voice, and generate a smart shopping list.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- PWA & Mobile Install Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#166534">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Groceries">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="header-top">
                <div class="brand">
                    <span class="brand-mark" aria-hidden="true">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                            <line x1="3" y1="6" x2="21" y2="6"/>
                            <path d="M16 10a4 4 0 0 1-8 0"/>
                        </svg>
                    </span>
                    <h1 class="brand-title">Grocery List</h1>
                </div>

                <div class="header-right">
                    <button type="button" id="auth-status-btn" class="auth-pill" title="Local storage mode (authentication ready)">
                        <span class="auth-dot" aria-hidden="true"></span>
                        <span id="auth-status-label">Local Mode</span>
                    </button>
                </div>
            </div>

            <nav class="mode-switcher" aria-label="App Mode">
                <button type="button" id="mode-store-btn" class="mode-tab active" data-mode="store" aria-pressed="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Store</span>
                </button>
                <button type="button" id="mode-inventory-btn" class="mode-tab" data-mode="inventory" aria-pressed="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                        <line x1="8" y1="23" x2="16" y2="23"/>
                    </svg>
                    <span>Inventory</span>
                    <span id="inventory-pending-badge" class="tab-badge hidden">0</span>
                </button>
            </nav>
        </header>

        <!-- STORE MODE -->
        <main id="store-view" class="main-content" aria-label="Store Mode">
            <div class="store-toolbar">
                <div class="view-toggle" role="group" aria-label="Store View">
                    <button type="button" id="view-all-btn" class="view-toggle-btn active" data-view="all">
                        All Items
                    </button>
                    <button type="button" id="view-shopping-btn" class="view-toggle-btn" data-view="shopping">
                        Shopping List
                        <span id="shopping-count-badge" class="count-badge">0</span>
                    </button>
                </div>

                <div class="toolbar-controls">
                    <div class="search-field">
                        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="search" id="store-search-input" class="search-input" placeholder="Search items or aisles..." aria-label="Search items or aisles" autocomplete="off">
                    </div>
                    <button type="button" id="add-aisle-open-btn" class="btn-secondary">
                        + Aisle
                    </button>
                </div>
            </div>

            <!-- Inline Add Aisle Form (toggled) -->
            <form id="add-aisle-form" class="add-aisle-card hidden">
                <input type="text" id="new-aisle-input" class="text-input" placeholder="New aisle name (e.g. Frozen, Bakery)..." aria-label="New aisle name" autocomplete="off">
                <div class="add-aisle-actions">
                    <button type="submit" class="btn-primary">Add Aisle</button>
                    <button type="button" id="add-aisle-cancel-btn" class="btn-ghost">Cancel</button>
                </div>
            </form>

            <div id="store-aisles-container" class="aisles-container">
                <!-- Rendered dynamically -->
            </div>

            <div id="shopping-cart-bar" class="cart-bar hidden" role="region" aria-label="Shopping trip cart">
                <div class="cart-bar-info">
                    <span id="cart-bar-count" class="cart-bar-count">0 in cart</span>
                </div>
                <div class="cart-bar-actions">
                    <button type="button" id="cart-clear-btn" class="btn-ghost-sm">Clear</button>
                    <button type="button" id="cart-commit-btn" class="btn-primary-sm">Finish Trip &amp; Update Inventory</button>
                </div>
            </div>
        </main>

        <!-- INVENTORY MODE -->
        <main id="inventory-view" class="main-content hidden" aria-label="Inventory Mode">
            <section class="voice-card" aria-label="Voice and Quick Inventory Entry">
                <div class="voice-card-header">
                    <div>
                        <h2 class="voice-card-title">Take Inventory</h2>
                        <p class="voice-card-subtitle">Say or type <code>&lt;item&gt; &lt;count&gt;</code> — e.g. <em>&ldquo;wipes 3&rdquo;</em> or <em>&ldquo;milk 2&rdquo;</em></p>
                    </div>
                    <button type="button" id="voice-mic-btn" class="mic-btn" aria-label="Start voice input" aria-pressed="false">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                        <span id="voice-mic-label">Speak</span>
                    </button>
                </div>

                <form id="inventory-command-form" class="command-form">
                    <input type="text" id="inventory-command-input" class="command-input" placeholder='Type or speak: "wipes 3", "bananas 4"...' aria-label="Inventory item and count" autocomplete="off">
                    <button type="submit" id="inventory-command-submit" class="btn-primary">Add</button>
                </form>

                <div id="voice-feedback" class="voice-feedback" role="status" aria-live="polite">
                    Ready — tap Speak or type an item &amp; count.
                </div>
            </section>

            <section class="inventory-list-section" aria-label="Inventory Entries">
                <div class="inventory-list-header">
                    <div class="inventory-summary" id="inventory-summary">0 entries</div>
                    <button type="button" id="clear-inventory-btn" class="btn-ghost-danger hidden">Clear All</button>
                </div>

                <ul id="inventory-entries-list" class="inventory-entries-list">
                    <!-- Rendered dynamically -->
                </ul>
            </section>
        </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
